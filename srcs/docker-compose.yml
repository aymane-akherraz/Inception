services:
  mariadb:
    build: requirements/mariadb/
    image: mariadb
    restart: on-failure
    secrets:
      - db_password
      - db_root_password
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - my_net

  nginx:
    build: requirements/nginx
    image: nginx
    restart: on-failure
    ports:
      - "443:443"
      # - "8443:443"
    env_file:
      - .env
    depends_on:
      - wordpress
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - my_net

  wordpress:
    build: requirements/wordpress/
    image: wordpress
    restart: on-failure
    secrets:
      - db_password
      - credentials
    env_file:
      - .env
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - my_net

  redis:
    build: requirements/bonus/redis
    image: redis
    restart: on-failure
    networks:
      - my_net

  vsftp:
    build: requirements/bonus/vsftp
    image: vsftp
    restart: on-failure
    secrets:
      - credentials
    env_file:
      - .env
    ports:
     - "21:21"
     - "30000-30009:30000-30009"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - my_net

  adminer:
    build: requirements/bonus/adminer
    image: adminer
    restart: on-failure
    networks:
      - my_net

  onlogs:
    build: requirements/bonus/onlogs
    image: onlogs
    restart: on-failure
    secrets:
      - credentials
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # - onlogs_data:/leveldb

    networks:
      - my_net
 
networks:
  my_net:
    name: my_net
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/user/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/user/data/wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  credentials:
    file: ../secrets/credentials.txt
