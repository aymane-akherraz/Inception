services:
  mariadb:
    build: requirements/mariadb/
    image: mariadb
    restart: on-failure
    secrets:
      - db_password
      - db_root_password
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - my_net

  nginx:
    build: requirements/nginx
    image: nginx
    restart: on-failure
    ports:
      - "443:443"
      # - "8443:443"
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - my_net

  wordpress:
    build: requirements/wordpress/
    image: wordpress
    restart: on-failure
    secrets:
      - db_password
      - credentials
    env_file:
      - .env
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - my_net

networks:
  my_net:
    name: my_net
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aakherra/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aakherra/data/wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  credentials:
    file: ../secrets/credentials.txt
