server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name aakherra.42.fr;

    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        # Split URL to isolate script path from extra path info
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Pass the request to the wordpress container via port 9000
        # 'wordpress' matches the exact service name in your docker-compose.yml
        fastcgi_pass wordpress:9000;
        
        # Define the default index file for FastCGI processing
        fastcgi_index index.php;
        
        # Include standard FastCGI parameters required by PHP-FPM
        include fastcgi_params;
        
        # Map the SCRIPT_FILENAME parameter so PHP knows exactly which file to execute
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
